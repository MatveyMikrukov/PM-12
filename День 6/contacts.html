<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">ЛОГОТИП</a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html#courses">Курсы</a></li>
                    <li><a href="index.html#advantages">Преимущества</a></li>
                    <li><a href="contacts.html" class="active">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contacts-page">
        <div class="container">
            <h1 class="contacts-title">Остались вопросы? Свяжитесь с нами!</h1>
            
            <div class="contacts-wrapper">
                <div class="map-container">
                    <div class="map-placeholder">[ИНТЕРАКТИВНАЯ КАРТА]</div>
                </div>

                <section class="form-container">
                    <h2>Форма обратной связи</h2>
                    <form action="#" method="POST" class="feedback-form">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Ваше имя" required autocomplete="name">
                        </div>
                        <div class="form-group">
                            <input type="email" name="email" placeholder="Ваш Email" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <textarea name="message" rows="5" placeholder="Ваше сообщение" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-submit">Отправить заявку</button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
